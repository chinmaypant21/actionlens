name: Taint Analysis Example
on:
  pull_request_target:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Capture PR Data
        id: capture
        run: echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT

      - name: Execute Build
        run: ./build.sh --title "${{ steps.capture.outputs.pr_title }}"