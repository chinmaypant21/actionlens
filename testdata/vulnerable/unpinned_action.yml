# Status: VULNERABLE
# Rule: AL-LINT-001 (Unpinned Third-Party Action)
# Insecure: References mutable tags ('@v4') and mutable branches ('@main').
#           A compromised tag or upstream repo can lead to supply chain attacks.

name: Vulnerable Unpinned Action
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@main
