# Status: VULNERABLE
# Rule: AL-CODE-001 (Script / Expression Injection)
# Insecure: Directly interpolates untrusted GitHub context (${{ github.event.issue.title }})
#           into inline bash script ('run:'). An attacker can inject arbitrary shell commands.

name: Vulnerable Issue Processor
on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Print issue title
        run: |
          echo "Processing issue: ${{ github.event.issue.title }}"
