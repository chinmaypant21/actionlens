name: Secure Issue Processor
on:
  issues:
    types: [opened, edited]

permissions:
  issues: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Print issue title safely
        # Remediated: untrusted input passed via intermediate environment variable
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Processing issue: $ISSUE_TITLE"
