# Status: SECURE
# Rule: AL-CODE-001 (Script / Expression Injection)
# Secure: Untrusted input is assigned to an intermediate environment variable ('env: ISSUE_TITLE').
#         The shell accesses '$ISSUE_TITLE' as data, preventing arbitrary code injection.

name: Secure Issue Processor
on:
  issues:
    types: [opened, edited]

permissions:
  issues: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Print issue title safely
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Processing issue: $ISSUE_TITLE"
