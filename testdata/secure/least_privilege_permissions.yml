# Status: SECURE
# Rule: AL-LINT-003 (Missing or Over-scoped Permissions Block)
# Secure: Top-level 'permissions: {}' denies all permissions by default;
#         job requests only minimal scope required ('issues: read').

name: Secure Least Privilege Permissions
on: [issues]

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - run: echo "Triaging issue with read-only token"
