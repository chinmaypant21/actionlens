# Status: SECURE
# Rule: AL-CODE-001 (Script injection)
# Secure: ${{ steps.<id>.outputs.<var> }} is tainted but securely passed
#         through an environment variable before being used in run.
name: tainted env-tunneled githuboutput
on: pull_request_target
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: x
        env:
          TITLE: ${{ github.event.pull_request.title }}     # SOURCE
        run: echo "out=$TITLE" >> "$GITHUB_OUTPUT"          # PROPAGATOR
      - env:
          out: ${{ steps.x.outputs.out }}                   # SANITIZER
        run: echo "Value $OUT"                              # SINK