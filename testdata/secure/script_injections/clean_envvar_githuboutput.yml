# Status: SECURE
# Rule: AL-CODE-001 (Script injection)
# Secure: ${{ steps.<id>.outputs.<var> }} is neither tainted nor used directly in run.
name: clean env-tunneled githuboutput
on: pull_request_target
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: x
        run: echo "y=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT" # no tainted SOURCE
      - env:
          Y: ${{ steps.x.outputs.y }}                     # SANITIZER
        run: echo "Value $Y"                              # SINK